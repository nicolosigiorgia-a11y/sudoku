<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="520" fill="#f6f8fd"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1b2440">Architettura — AI Sudoku Vision &amp; Tutor</text>
  <text x="40" y="78" font-size="14" fill="#5a6685">APK Flutter → backend proxy → Gemini API · solutore esatto in locale</text>

  <g>
    <rect x="40" y="130" width="230" height="150" rx="18" fill="#ffffff" stroke="#4457a8" stroke-width="3"/>
    <text x="155" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#4457a8">APK Flutter</text>
    <text x="155" y="194" text-anchor="middle" font-size="13" fill="#33405f">Camera / Galleria</text>
    <text x="155" y="216" text-anchor="middle" font-size="13" fill="#33405f">Griglia 9×9 editabile</text>
    <text x="155" y="238" text-anchor="middle" font-size="13" fill="#33405f">Avatar · TTS · Hint</text>
    <text x="155" y="262" text-anchor="middle" font-size="12" fill="#7a86a8">dart: solver + UI</text>
  </g>

  <g>
    <rect x="365" y="130" width="230" height="150" rx="18" fill="#ffffff" stroke="#12a594" stroke-width="3"/>
    <text x="480" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#0e8275">Backend proxy Node</text>
    <text x="480" y="194" text-anchor="middle" font-size="13" fill="#33405f">POST /api/ocr</text>
    <text x="480" y="216" text-anchor="middle" font-size="13" fill="#33405f">POST /api/explain</text>
    <text x="480" y="238" text-anchor="middle" font-size="13" fill="#33405f">GET  /api/status</text>
    <text x="480" y="262" text-anchor="middle" font-size="12" fill="#7a86a8">GEMINI_API_KEY nei Supabase Secrets</text>
  </g>

  <g>
    <rect x="690" y="130" width="230" height="150" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="805" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#6d3fd1">Google Gemini</text>
    <text x="805" y="196" text-anchor="middle" font-size="13" fill="#33405f">OCR foto → JSON grid</text>
    <text x="805" y="220" text-anchor="middle" font-size="13" fill="#33405f">Structured Outputs</text>
    <text x="805" y="244" text-anchor="middle" font-size="13" fill="#33405f">Spiegazione in italiano</text>
    <text x="805" y="266" text-anchor="middle" font-size="12" fill="#7a86a8">gemini-3.6-flash</text>
  </g>

  <g stroke="#33405f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M270 205 L365 205"/>
    <path d="M595 205 L690 205"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#33405f"/>
    </marker>
  </defs>
  <text x="318" y="190" text-anchor="middle" font-size="11" fill="#5a6685">JSON</text>
  <text x="642" y="190" text-anchor="middle" font-size="11" fill="#5a6685">HTTPS</text>

  <g>
    <rect x="365" y="330" width="230" height="110" rx="18" fill="#fff7e0" stroke="#e0a500" stroke-width="3"/>
    <text x="480" y="365" text-anchor="middle" font-size="17" font-weight="700" fill="#8a6200">Solver ibrido</text>
    <text x="480" y="392" text-anchor="middle" font-size="13" fill="#5c4a18">Backtracking esatto in Flutter</text>
    <text x="480" y="414" text-anchor="middle" font-size="13" fill="#5c4a18">Gemini spiega, non calcola</text>
  </g>
  <path d="M155 280 C155 360 260 385 365 385" stroke="#e0a500" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="235" y="345" font-size="11" fill="#8a6200">mossa verificata</text>

  <text x="40" y="485" font-size="12" fill="#7a86a8">La chiave API non è mai inclusa nell'APK: resta sul server (file .env non versionato).</text>
</svg>
