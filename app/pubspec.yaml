name: ai_sudoku_cat
description: "AI Sudoku Vision & Tutor — Cat Edition - app Android con OCR Gemini e tutor logico"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.0
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.0
  supabase_flutter: ^2.18.3
  tesseract_ocr: ^0.6.0
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/eng.traineddata
